<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <linearGradient id="surface" x2="0" y2="1">
      <stop stop-color="#fbfcfd"/>
      <stop offset="1" stop-color="#edf0f3"/>
    </linearGradient>
    <linearGradient id="boxFront" x2="0" y2="1">
      <stop stop-color="#fff"/>
      <stop offset="1" stop-color="#e8edf2"/>
    </linearGradient>
    <linearGradient id="boxSide" x2="1" y2="0">
      <stop stop-color="#e0e5ea"/>
      <stop offset="1" stop-color="#bfc8d1"/>
    </linearGradient>
    <linearGradient id="boxTop" x2="0" y2="1">
      <stop stop-color="#235a96"/>
      <stop offset="1" stop-color="#143c6a"/>
    </linearGradient>
    <linearGradient id="blueBand" x2="0" y2="1">
      <stop stop-color="#2263a7"/>
      <stop offset="1" stop-color="#164576"/>
    </linearGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d1d4d7"/>
      <stop offset=".32" stop-color="#858b91"/>
      <stop offset=".58" stop-color="#c4c8cb"/>
      <stop offset="1" stop-color="#686e74"/>
    </linearGradient>
    <linearGradient id="cableLight" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eceeef"/>
      <stop offset=".48" stop-color="#aeb3b7"/>
      <stop offset="1" stop-color="#626970"/>
    </linearGradient>
    <linearGradient id="sideCable" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#555c63"/>
      <stop offset=".45" stop-color="#c1c5c8"/>
      <stop offset="1" stop-color="#737a80"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f5ce8c"/>
      <stop offset=".45" stop-color="#bd7840"/>
      <stop offset="1" stop-color="#83502f"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <pattern id="cardGrain" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 7.5H8" stroke="#fff" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1000" height="1000" rx="32" fill="url(#surface)"/>
  <ellipse cx="522" cy="815" rx="380" ry="55" fill="#172536" opacity=".15" filter="url(#shadow)"/>

