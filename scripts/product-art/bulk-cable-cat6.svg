    <path d="M596 716 779 667" stroke="#fff" stroke-opacity=".38" stroke-width="2"/>

    <path d="M155 282 560 318V758L155 718Z" fill="url(#cardGrain)"/>
  </g>

  <ellipse cx="742" cy="746" rx="220" ry="34" fill="#1c2935" opacity=".22" filter="url(#softShadow)"/>

