    <path d="M890 619C909 675 901 720 858 744c-47 27-111 11-151 3" stroke="#4b525a" stroke-width="28"/>
    <path d="M890 613C909 669 901 714 858 738c-47 27-111 11-151 3" stroke="url(#cable)" stroke-width="20"/>
